name: Release integration

# HACS chỉ báo «có bản cập nhật» khi có GitHub Release; nếu không, nó bám commit trần và không bao giờ báo.
# Mỗi số phiên bản mới trong manifest.json của tích hợp được tự tạo một Release (dùng cho HACS).

on:
  push:
    branches: [main]
    paths:
      - custom_components/mikrotik_snmp/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the manifest version as a release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version and release notes
        id: info
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          version = json.load(open("custom_components/mikrotik_snmp/manifest.json"))["version"]
          readme = open("README.md", encoding="utf-8").read()
          match = re.search(rf"^## Thay đổi ở {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", readme, re.M | re.S)
          notes = match.group(1).strip() if match else ""
          notes = notes or f"Mạng LAN MikroTik + ZTE {version}"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY

      - name: Create the release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.info.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already released"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Mạng LAN MikroTik + ZTE $TAG" --notes-file release-notes.md
